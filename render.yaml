services:
  - type: web
    name: web-creator-360
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SAAS_MODE
        value: "true"
      - key: BASE_URL
        sync: false                     # e.g. https://web-creator-360.onrender.com
      # This app has no per-route login: without these two, anyone with the URL sees your data and can trigger real
      # sends. Any username/password you choose; set both.
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_SCOPE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRO_ANNUAL
        sync: false
      - key: STRIPE_AGENCY_MONTHLY
        sync: false
      - key: STRIPE_AGENCY_ANNUAL
        sync: false
      - key: PREVIEW_EXPIRY_DAYS
        value: "15"
      # New-business leads (LLCs) pipeline: same values as the campaign service below
      - key: NEW_LEADS_OWNER_USER_ID
        sync: false
      - key: INSTANTLY_API_KEY
        sync: false
      - key: INSTANTLY_CAMPAIGN_ID
        sync: false
      - key: CAMPAIGN_PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Public server of the new-business campaign: the page each lead opens from the email (to ask for a call), plus a cron
  # that asks Instantly's API every 5 minutes what happened to each lead (sent, bounced, unsubscribed, replied — no
  # webhook needed). It has no dashboard and no cron of the main app, so it is safe to expose. Create ONLY this service
  # for the campaign (New > Web Service), not the whole blueprint: the service above (full app) is not needed for it.
  - type: web
    name: web-creator-360-campaign
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node src/campaign-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: NEW_LEADS_OWNER_USER_ID
        sync: false
      - key: INSTANTLY_API_KEY
        sync: false
      - key: INSTANTLY_CAMPAIGN_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
